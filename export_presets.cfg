html, body, #canvas { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#status { background-color: #12100d; }
#status-splash { position: static !important; width: min(62vw, 280px) !important; height: auto !important; max-height: 55vh; margin: 0 !important; object-fit: contain; }
#status-progress { position: static !important; width: min(56vw, 280px) !important; height: 10px; margin: 8px 0 0 0 !important; -webkit-appearance: none; appearance: none; border: none; border-radius: 5px; background: #292524; overflow: hidden; }
#status-progress::-webkit-progress-bar { background: #292524; border-radius: 5px; }
#status-progress::-webkit-progress-value { background: linear-gradient(90deg, #d97706, #fbbf24); border-radius: 5px; }
#status-progress::-moz-progress-bar { background: linear-gradient(90deg, #d97706, #fbbf24); border-radius: 5px; }
</style>
<script>window.addEventListener('contextmenu', function(e) { if (e.target && e.target.id === 'canvas') e.preventDefault(); }, { passive: false });</script>"
